name: test

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt

      - name: Run critical pipeline/db tests (fast feedback)
        run: pytest tests/test_db.py tests/test_pipeline.py -q

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy db.py scraper.py openrouter.py classifier.py pipeline.py bot.py scheduler.py export_sheets.py main.py healthcheck.py smoke_collect.py url_safety.py

      - name: Docker Compose config
        run: docker compose config -q

      - name: Run tests with coverage gate
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=80 -q

