services:
  pain_finder:
    build: .
    container_name: pain_finder
    env_file:
      - path: .env
        required: false
    environment:
      DB_PATH: /app/data/pain_finder.db
      REPORTS_DIR: /app/reports
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports

